[package]
name = "odc-testkit"
description = "Test support, only ever a dev-dependency: expected frames, picture diff, capture logs, the hardware probe"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
odc-device = { path = "../odc-device" }
odc-ipc = { path = "../odc-ipc" }
odc-protocol = { path = "../odc-protocol" }
odc-sensors = { path = "../odc-sensors" }
# The settings app's fake service reads its state from a TOML file (Phase 10 plan, Task 8).
toml = "1"
# The dev service's probe asks the system bus who owns its name (Phase 7 plan, Task 9), and the
# settings app's fake service serves the main interface (Phase 10 plan, Task 8).
zbus = "6"

[dev-dependencies]
futures-core = "0.3"

[lints]
workspace = true

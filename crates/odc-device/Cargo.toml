[package]
name = "odc-device"
description = "The display port and the LP360's hidraw adapter, which finds the cooler by USB ID and reconnects"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
odc-protocol = { path = "../odc-protocol" }
# CLOCK_MONOTONIC for the recording's stamps (Phase 9 plan, Task 5); already in the tree through
# zbus.
rustix = { version = "1", features = ["time"] }

[dev-dependencies]
odc-testkit = { path = "../odc-testkit" }

[lints]
workspace = true

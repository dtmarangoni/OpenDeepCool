[package]
name = "odc-sensors-detect"
description = "Runs lm-sensors' sensors-detect once per motherboard when the PC has no lm-sensors setup, and records what it created; the one part that runs as root"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dev-dependencies]
odc-testkit = { path = "../odc-testkit" }

# The tests' own binary also plays the fake sensors-detect and systemctl (AGENTS.md rule 13),
# so it has its own main instead of the test harness.
[[test]]
name = "detect"
harness = false

[lints]
workspace = true

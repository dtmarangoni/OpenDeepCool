[package]
name = "odc-e2e"
description = "Layer 4: the end-to-end checks, on the real hardware where present and fakes where absent; dev-only"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
odc-device = { path = "../odc-device" }
odc-gpu-rank = { path = "../odc-gpu-rank" }
odc-ipc = { path = "../odc-ipc" }
odc-protocol = { path = "../odc-protocol" }
odc-render = { path = "../odc-render" }
odc-sensors = { path = "../odc-sensors" }
# The engine and the start line's reader, for the service checks (Phase 7 plan, Task 9).
odc-service = { path = "../odc-service" }
odc-testkit = { path = "../odc-testkit" }
# The dev service's test session, on the system bus (Phase 7 plan, Task 9).
zbus = "6"

# The Music tools' tests: their own binary also plays the fake pactl, systemctl, pw-dump and helper
# (AGENTS.md rule 13), so it has its own main instead of the test harness.
[[test]]
name = "music_tools"
harness = false

[lints]
workspace = true

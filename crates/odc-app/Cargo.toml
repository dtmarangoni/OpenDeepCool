[package]
name = "odc-app"
description = "OpenDeepCool's settings app: one GTK4 window that mirrors the cooler and changes its settings"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "opendeepcool"
path = "src/main.rs"

[features]
# The tests that start a headless weston (solution review P4-05, P10-04): outside
# `cargo test --workspace`, the guard and the PKGBUILD's check(); CI runs them in a job of their own.
weston-tests = []

[dependencies]
futures-core = "0.3"
# 4.20: the CSS provider's colour scheme (design, Unverified points answered); 4.14:
# accessible announcements.
gtk = { package = "gtk4", version = "0.11", features = ["v4_20"] }
odc-ipc = { path = "../odc-ipc" }
odc-protocol = { path = "../odc-protocol" }
odc-render = { path = "../odc-render" }
odc-sensors = { path = "../odc-sensors" }
toml = "1"
zbus = "6"

# Layer 3: the window in a headless weston, on GTK's main thread, so with a harness of its own.
[[test]]
name = "window"
harness = false
required-features = ["weston-tests"]

[[test]]
name = "display_page"
harness = false
required-features = ["weston-tests"]

[[test]]
name = "config_page"
harness = false
required-features = ["weston-tests"]

[[test]]
name = "theme"
harness = false
required-features = ["weston-tests"]

[dev-dependencies]
odc-testkit = { path = "../odc-testkit" }
proptest.workspace = true

[lints]
workspace = true

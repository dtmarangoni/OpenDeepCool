[package]
name = "odc-service"
description = "The display service: its settings, the engine and its threads, D-Bus, and the opendeepcoold binary"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
futures-core = "0.3"
odc-device = { path = "../odc-device" }
odc-ipc = { path = "../odc-ipc" }
odc-protocol = { path = "../odc-protocol" }
odc-render = { path = "../odc-render" }
odc-sensors = { path = "../odc-sensors" }
serde = { version = "1", features = ["derive"] }
signal-hook = "0.4"
toml = "1"
zbus = "6"

[dev-dependencies]
# The state files' names, checked against the dev teardown's list (Phase 7 plan, Task 8).
odc-gpu-rank = { path = "../odc-gpu-rank" }
odc-manifest = { path = "../odc-manifest" }
odc-testkit = { path = "../odc-testkit" }
# The panic test's child turns its core dump off (owner, 2026-11-04); already in the tree through
# zbus.
rustix = { version = "1", features = ["process"] }
# The fake polkit runs on a peer-to-peer connection (Phase 7 plan, Task 7); no new crate.
zbus = { version = "6", features = ["p2p"] }


[[bin]]
name = "opendeepcoold"
path = "src/main.rs"

[[test]]
name = "panic"
harness = false

[lints]
workspace = true

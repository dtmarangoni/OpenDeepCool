<!DOCTYPE busconfig PUBLIC
          "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
          "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  OpenDeepCool's display service on the system bus (docs/spec/dbus.md, Who may call; Phase 7
  plan, Task 8). Every rule names the destination, paired with an interface or a path, because a
  message's interface field is optional (dbus-daemon(1)). The service checks every caller itself
  with polkit, because a bus policy can't tell sessions apart.
-->
<busconfig>
  <!-- Only the service's account may own the name. -->
  <policy user="opendeepcool">
    <allow own="io.github.dtmarangoni.OpenDeepCool1"/>
  </policy>

  <policy context="default">
    <!-- No method call reaches the service unless a rule below allows it. Signals aren't
         denied: a send_destination rule applies to whoever owns the name (dbus-daemon(1)), so
         a blanket deny could keep logind's broadcast PrepareForSleep from the service. -->
    <deny send_destination="io.github.dtmarangoni.OpenDeepCool1" send_type="method_call"/>
    <allow send_destination="io.github.dtmarangoni.OpenDeepCool1"
           send_interface="io.github.dtmarangoni.OpenDeepCool1"
           send_path="/io/github/dtmarangoni/OpenDeepCool1"/>
    <allow send_destination="io.github.dtmarangoni.OpenDeepCool1"
           send_interface="org.freedesktop.DBus.Introspectable"
           send_path="/io/github/dtmarangoni/OpenDeepCool1"/>
  </policy>

  <!-- The dev interface, which exists only with the dev copy's switch: group opendeepcool
       only, and each call checks the caller's groups and polkit as well. -->
  <policy group="opendeepcool">
    <allow send_destination="io.github.dtmarangoni.OpenDeepCool1"
           send_path="/io/github/dtmarangoni/OpenDeepCool1/Dev"/>
  </policy>
</busconfig>

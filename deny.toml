# cargo-deny's configuration (Phase 5 plan, Task 10; solution review P5-07): RustSec advisories,
# licences compatible with distributing OpenDeepCool under MIT, crates.io as the only source, and
# no duplicate versions unless one is allowed below with its reason. CI runs `cargo deny check`.

[graph]
# Arch Linux on x86_64 is the only platform OpenDeepCool supports.
targets = ["x86_64-unknown-linux-gnu"]

[advisories]
# Every vulnerability, unsound and notice advisory is an error; ignore one only with a reason.
ignore = []

[licenses]
# Every dependency in the graph offers MIT or Apache-2.0, one also requires Unicode-3.0 (counted
# with `cargo metadata`, 2026-10-28), and libloading, which nvml-wrapper loads NVIDIA's library
# with, is ISC (owner, 2026-10-28; Phase 6 plan, Task 8). bindgen, in the dev tool odc-bindings
# only, is BSD-3-Clause (owner, 2026-10-28; Phase 6 plan, Task 9; counted 2026-10-29).
allow = ["MIT", "Apache-2.0", "Unicode-3.0", "ISC", "BSD-3-Clause"]

[bans]
multiple-versions = "deny"
wildcards = "deny"
# The workspace's own crates are path dependencies without a version; they're never published.
allow-wildcard-paths = true
# Duplicate versions allowed, one at a time, each with its reason.
skip = [
    # zbus's macros and serde's derive are built with syn 3, while nvml-wrapper (through
    # thiserror 1 and wrapcenum-derive's darling 0.20), tracing-attributes (zbus's tracing) and
    # bindgen 0.72, in the dev tool only, still need syn 2. syn runs only while macros compile,
    # so nothing of it reaches the binaries. Owner, 2026-10-29 (Phase 7 plan, Task 4); removed
    # once nvml-wrapper moves to syn 3, which each phase's sign-off checks.
    { crate = "syn@2.0.119", reason = "nvml-wrapper, tracing-attributes and bindgen still build with syn 2 (owner, 2026-10-29)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

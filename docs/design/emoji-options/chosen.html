<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenDeepCool: the three chosen emoji, over the spectrum and alone</title>
<style>
:root{color-scheme:dark light;--bg:#2d3039;--ink:#e5ebf2;--mute:#b3b6c2;--glass:#1f2229;--lit:#e5ebf2;--accent:#94b7d6}
@media (prefers-color-scheme:light){:root{--bg:#d9e3ec;--ink:#2d3039;--mute:#555862;--glass:#2d3039;--lit:#e5ebf2;--accent:#365675}}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif;padding:24px}
h1{font-size:1.44em;margin:0 0 4px}p{color:var(--mute);margin:0 0 20px;max-width:60ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.card{background:color-mix(in srgb,var(--bg) 70%,#fff 8%);border-radius:10px;padding:12px}
canvas{display:block;width:100%;aspect-ratio:1;background:var(--glass);border-radius:8px}
.cap{font-weight:600;margin-top:8px}.meta{color:var(--mute);font-size:.83em}
</style></head><body>
<h1>The three chosen emoji, as the cooler draws them</h1>
<p>Lub-dub, Coffee break and Cat tail, each over a moving spectrum (modes 14 to 16) and alone on the whole 14 &times; 14 grid (modes 24 to 26). One tick is 100 ms, as on the cooler. The spectrum here is made up: on the cooler it follows the sound.</p>
<div class="grid" id="grid"></div>
<script>
var DATA = [{"mode": 14, "name": "Lub-dub + Spectrum", "pics": [["..............", "....##..##....", "...########...", "...########...", "....######....", ".....####.....", "......##......"], ["...###..###...", "..##########..", "..##########..", "...########...", "....######....", ".....####.....", "......##......"], ["...###..###...", "..##########..", "#.##########.#", "...########...", "....######....", ".....####.....", "......##......"]], "loop": [[0, 6], [1, 1], [0, 1], [2, 2]]}, {"mode": 24, "name": "Lub-dub (alone)", "pics": [["..............", "..............", "..............", "....##..##....", "...########...", "...########...", "....######....", ".....####.....", "......##......", "..............", "..............", "..............", "##############", ".............."], ["..............", "...###..###...", "..##########..", "..##########..", "..##########..", "...########...", "....######....", ".....####.....", "......##......", "..............", "......#.......", ".....#.#......", "#####...######", "........#....."], ["..####..####..", ".############.", ".############.", ".############.", "#.##########.#", "...########...", "....######....", ".....####.....", "......##......", "..............", "........#.....", ".......#.#....", "#######...####", ".............."], ["..............", "...###..###...", "..##########..", "..##########..", "..##########..", "...########...", "....######....", ".....####.....", "......##......", "..............", "..............", "..............", "##############", ".............."]], "loop": [[0, 7], [1, 1], [0, 1], [2, 2], [3, 1]]}, {"mode": 15, "name": "Coffee break + Spectrum", "pics": [[".........#....", "........#.....", ".....#........", "....######.##.", "....######..#.", ".....####.....", "...########..."], [".........#....", "......#.......", ".....#........", "....######.##.", "....######..#.", ".....####.....", "...########..."], [".....#........", "......#.......", ".....#........", "....######.##.", "....######..#.", ".....####.....", "...########..."], [".....#........", "......#.......", ".........#....", "....######.##.", "....######..#.", ".....####.....", "...########..."], [".....#........", "........#.....", ".........#....", "....######.##.", "....######..#.", ".....####.....", "...########..."], [".........#....", "........#.....", ".........#....", "....######.##.", "....######..#.", ".....####.....", "...########..."]], "loop": [[0, 2], [1, 2], [2, 2], [3, 2], [4, 2], [5, 2]]}, {"mode": 25, "name": "Coffee break (alone)", "pics": [["......#.......", ".....#........", ".........#....", "........#.....", "......#.......", ".....#........", ".........#....", "........#.....", "......#.......", ".....#........", "....######.##.", "....######..#.", ".....####.....", "...########..."], ["........#.....", "......#.......", ".....#........", ".........#....", "........#.....", "......#.......", ".....#........", ".........#....", "........#.....", "......#.......", "....######.##.", "....######..#.", ".....####.....", "...########..."], [".........#....", "........#.....", "......#.......", ".....#........", ".........#....", "........#.....", "......#.......", ".....#........", ".........#....", "........#.....", "....######.##.", "....######..#.", ".....####.....", "...########..."], [".....#........", ".........#....", "........#.....", "......#.......", ".....#........", ".........#....", "........#.....", "......#.......", ".....#........", ".........#....", "....######.##.", "....######..#.", ".....####.....", "...########..."]], "loop": [[0, 3], [1, 3], [2, 3], [3, 3]]}, {"mode": 16, "name": "Cat tail + Spectrum", "pics": [["....#....#....", "....######....", "....######....", ".....####.....", "...########...", "...#########.#", "...########.##"], ["....#....#....", "....######....", "....######....", ".....####.....", "...########..#", "...##########.", "...########..."], ["....#....#....", "....######....", "....######...#", ".....####...#.", "...########.#.", "...#########..", "...########..."]], "loop": [[0, 3], [1, 1], [2, 2], [1, 1]]}, {"mode": 26, "name": "Cat tail (alone)", "pics": [["..............", "...#......#...", "...##....##...", "...########...", "...##.##.##...", "...########...", "....######....", "...########...", "..##########..", "..##########..", "..##########..", "..##########..", "..###....###.#", "...........###"], ["..............", "...#......#...", "...##....##...", "...########...", "...##.##.##...", "...########...", "....######....", "...########...", "..##########..", "..##########.#", "..##########.#", "..###########.", "..###....####.", ".............."], ["..............", "...#......#...", "...##....##...", "...########...", "...##.##.##...", "...########...", "....######....", "...########..#", "..###########.", "..###########.", "..###########.", "..##########..", "..###....###..", ".............."], ["..............", "...#......#...", "...##....##...", "...########...", "...##.##.##...", "...#########..", "....######.#..", "...########.#.", "..###########.", "..###########.", "..###########.", "..##########..", "..###....###..", ".............."], ["..............", "...#......#...", "...##....##...", "...########...", "...########...", "...########...", "....######....", "...########...", "..##########..", "..##########..", "..##########..", "..##########..", "..###....###.#", "...........###"]], "loop": [[0, 3], [4, 1], [0, 2], [1, 1], [2, 1], [3, 2], [2, 1], [1, 1]]}];
var grid = document.getElementById("grid"), cards = [];
DATA.forEach(function (d) {
  var card = document.createElement("div"); card.className = "card";
  var c = document.createElement("canvas"); c.width = c.height = 280;
  var cap = document.createElement("div"); cap.className = "cap"; cap.textContent = "Mode " + d.mode + ": " + d.name;
  var ticks = d.loop.reduce(function (s, x) { return s + x[1]; }, 0);
  var meta = document.createElement("div"); meta.className = "meta"; meta.textContent = d.pics.length + " pictures, " + ticks + " ticks, " + ticks * 100 + " ms";
  card.appendChild(c); card.appendChild(cap); card.appendChild(meta); grid.appendChild(card);
  cards.push({ d: d, ctx: c.getContext("2d"), ticks: ticks });
});
function pictureAt(d, t) { var k = t % d.loop.reduce(function (s, x) { return s + x[1]; }, 0), i;
  for (i = 0; i < d.loop.length; i++) { if (k < d.loop[i][1]) return d.pics[d.loop[i][0]]; k -= d.loop[i][1]; } }
function draw(card, t) {
  var d = card.d, ctx = card.ctx, p = 20, r = 7, rows = pictureAt(d, t), bar, h, c, k, i, j, lit;
  var grid = []; for (i = 0; i < 14; i++) { grid.push([]); for (j = 0; j < 14; j++) grid[i].push(false); }
  rows.forEach(function (row, y) { for (j = 0; j < 14; j++) { if (row.charAt(j) === "#") grid[y][j] = true; } });
  if (d.mode < 20) { for (c = 0; c < 14; c++) { h = 1 + Math.floor(2.5 + 2.5 * Math.sin(t * 0.7 + c * 0.9)); for (k = 0; k < h; k++) grid[13 - k][c] = true; } }
  ctx.clearRect(0, 0, 280, 280);
  var style = getComputedStyle(document.documentElement), litc = style.getPropertyValue("--lit").trim();
  for (i = 0; i < 14; i++) for (j = 0; j < 14; j++) { ctx.beginPath(); ctx.arc(j * p + p / 2, i * p + p / 2, r, 0, 6.2832);
    ctx.fillStyle = grid[i][j] ? litc : "rgba(230,243,250,.12)"; ctx.fill(); }
}
var t = 0; function step() { cards.forEach(function (c) { draw(c, t); }); t++; }
step(); setInterval(step, 100);
</script></body></html>

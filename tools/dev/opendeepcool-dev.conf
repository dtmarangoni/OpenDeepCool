# The dev copy of OpenDeepCool's display service (Phase 7 plan, Task 8): the dev build, which
# odc-dev installs, started with --dev for the dev interface and the frame recording. Never
# packaged. The tests run as the owner, in group opendeepcool, and read the recording, so the
# state directory and its files are group-readable here.
[Service]
ExecStart=
ExecStart=/usr/local/libexec/opendeepcool-dev/opendeepcoold --dev
UMask=0027
StateDirectoryMode=0750

[workspace]
members = ["crates/*", "tools/*"]
resolver = "3"

[workspace.package]
edition = "2024"
# The newest stable Rust, always (owner, 2026-11-17): this and `mise.toml` follow it, and at the start
# of the alpha (Phase 12) both move to the latest stable and are tested; the owner uses that build
# through the alpha and the beta. (Measured the same day, for the record: the oldest that builds
# the shipped programs is 1.92, the highest `rust-version` a dependency declares.)
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
proptest = "1.12"

# A panic in any thread ends the whole service, so systemd restarts it (Phase 7 plan, Task 8;
# solution review OV-03). An arithmetic overflow stops the program too, instead of wrapping
# silently, as the tests already run (Phase 11 plan, Task 2; owner, 2026-11-10: "the most secure
# possible"). Wrapping that is meant uses the `wrapping_` methods.
[profile.release]
panic = "abort"
overflow-checks = true

# The package test's snapshot hashes every file of a 2.3 GB root about twenty times a run; an
# unoptimised SHA-256 took 30 s a snapshot (Phase 11 plan, Task 5). Only the hash is optimised in
# the dev profile.
[profile.dev.package.sha2]
opt-level = 3

# The end-to-end checks' CPU load runs one busy loop, and an unoptimised build of that loop heats a
# core far more than the optimised one: one thread for 5 s took the package from 33 °C to 59–61 °C
# unoptimised and to 45–46 °C optimised (Phase 11, 2026-11-17). The checks must never push the CPU
# towards 60 °C (owner, 2026-11-17), so this crate is optimised in the dev profile, where
# `odc-e2e` runs; the load also stops itself at 50 °C.
[profile.dev.package.odc-e2e]
opt-level = 3

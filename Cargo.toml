[workspace]
members = ["crates/*", "tools/*"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
proptest = "1.12"

# A panic in any thread ends the whole service, so systemd restarts it (Phase 7 plan, Task 8;
# solution review OV-03).
[profile.release]
panic = "abort"
